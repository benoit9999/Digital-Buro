{%- if tracking_enabled %}
<div class="consent" role="dialog" aria-labelledby="consent-title" aria-describedby="consent-text" data-consent hidden>
  <p class="consent__title" id="consent-title">{{ t.consent_title }}</p>
  <p class="consent__text" id="consent-text">{{ t.consent_text }} <a href="/confidentialite/#cookies">{{ t.consent_more }}</a></p>
  <div class="consent__actions">
    <button class="btn btn--primary" type="button" data-consent-accept>{{ t.consent_accept }}</button>
    <button class="btn btn--outline" type="button" data-consent-reject>{{ t.consent_reject }}</button>
  </div>
</div>
{%- endif %}
