<div class="announce">
  <div class="container announce__inner">
    <span class="status" data-status data-state="unknown"><span class="status__dot" aria-hidden="true"></span><span data-status-text>{{ t.hours_short }}</span></span>
    <span class="announce__extra"><span class="announce__sep" aria-hidden="true">·</span> {{ t.addr_full }}</span>
    <a href="{{ site.google.directions_url }}" target="_blank" rel="noopener" data-track="directions">{{ t.directions }} →</a>
  </div>
</div>
